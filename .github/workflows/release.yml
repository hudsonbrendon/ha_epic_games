name: Release

on:
  push:
    branches: [main, master]
    paths:
      - custom_components/epic_games/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read manifest version
        id: version
        run: echo "version=$(jq -r .version custom_components/epic_games/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Zip integration
        run: cd custom_components/epic_games && zip -r "$GITHUB_WORKSPACE/epic_games.zip" . -x '__pycache__/*'
      - name: Create release when the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
          else
            gh release create "$TAG" "epic_games.zip" --title "$TAG" --generate-notes
          fi
